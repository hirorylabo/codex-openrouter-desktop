name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Test and audit
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 scripts/secret_scan.py --tree . --git-history
      - name: Build release assets
        run: |
          python3 scripts/build_release.py "$GITHUB_REF_NAME"
          python3 scripts/secret_scan.py --tree . --archive "dist/codex-openrouter-desktop-$GITHUB_REF_NAME.tar.gz"
          cd dist && sha256sum -c SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/codex-openrouter-desktop-${{ github.ref_name }}.tar.gz
            dist/codex-openrouter-desktop-${{ github.ref_name }}.spdx.json
            dist/SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/codex-openrouter-desktop-$GITHUB_REF_NAME.tar.gz"
          "dist/codex-openrouter-desktop-$GITHUB_REF_NAME.spdx.json"
          dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --prerelease
          --title "codex-openrouter-desktop $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
