name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == 'refs/tags/v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Test and audit
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          cd portable/patcher-js && npm ci --ignore-scripts && npm test && cd ../..
          python3 scripts/secret_scan.py --tree . --git-history
          python3 scripts/audit_upstream.py
      - name: Build release assets
        run: |
          python3 scripts/build_release.py "$GITHUB_REF_NAME"
          python3 scripts/secret_scan.py --tree . --archive "dist/codex-openrouter-desktop-$GITHUB_REF_NAME.tar.gz"
          cd dist && sha256sum -c SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/codex-openrouter-desktop-v0.1.0.tar.gz
            dist/codex-openrouter-desktop-v0.1.0.spdx.json
            dist/SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/codex-openrouter-desktop-v0.1.0.tar.gz
          dist/codex-openrouter-desktop-v0.1.0.spdx.json
          dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --prerelease
          --title "codex-openrouter-desktop v0.1.0"
          --notes-file RELEASE_NOTES.md
