name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python tests
        run: PYTHONPATH=src python3 scripts/run_unit_tests.py
      - name: Python syntax
        run: python3 -m compileall -q src portable scripts
      - name: Validate upstream reference manifest
        run: python3 scripts/check_upstreams.py --validate-only

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # compileallは構文しか見ない。未定義名（F821）はここでしか止まらない。
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.3"
          args: check --output-format=github

  audit-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Tree and history secret scan
        run: python3 scripts/secret_scan.py --tree . --git-history
      - name: Build and scan release archive
        run: |
          release_version="v$(tr -d '\n' < VERSION)"
          python3 scripts/build_release.py "$release_version"
          python3 scripts/secret_scan.py --tree . --archive "dist/codex-openrouter-desktop-$release_version.tar.gz"
          cd dist && sha256sum -c SHA256SUMS

  macos-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Keychain helper and Desktop launcher
        run: |
          xcrun swiftc portable/credential/CredentialHelper.swift -o /tmp/codex-openrouter-credential
          xcrun swiftc portable/launcher/app/*.swift -o /tmp/CodexOpenRouterLauncher
          portable/launcher/build_icon.zsh portable/launcher/CreateLauncherIcon.swift /tmp/AppIcon.icns
          test -s /tmp/AppIcon.icns
      - name: Launcher decoder compatibility
        run: |
          xcrun swiftc -parse-as-library \
            portable/launcher/app/ProfileBridge.swift \
            portable/tests/DecoderCompatTests.swift \
            -o /tmp/decoder-compat
          /tmp/decoder-compat

      - name: Parse zsh entry points
        run: |
          zsh -n portable/templates/codex-openrouter-app.zsh.in
          zsh -n portable/launcher/build_icon.zsh
      - name: Synthetic upgrade, promotion, and rollback E2E
        run: PYTHONPATH=src python3 scripts/macos_synthetic_e2e.py

  ci-required:
    runs-on: ubuntu-latest
    needs: [python-compat, lint, audit-release, macos-compile]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        env:
          PYTHON_COMPAT: ${{ needs.python-compat.result }}
          LINT: ${{ needs.lint.result }}
          AUDIT_RELEASE: ${{ needs.audit-release.result }}
          MACOS_COMPILE: ${{ needs.macos-compile.result }}
        run: |
          echo "python-compat=$PYTHON_COMPAT"
          echo "lint=$LINT"
          echo "audit-release=$AUDIT_RELEASE"
          echo "macos-compile=$MACOS_COMPILE"
          failed=0
          for result in "$PYTHON_COMPAT" "$LINT" "$AUDIT_RELEASE" "$MACOS_COMPILE"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::required CI jobs did not all succeed"
            exit 1
          fi
