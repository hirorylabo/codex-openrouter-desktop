name: Bug report
description: 秘密値を含まない再現可能な不具合報告
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: API key、auth、Cookie、ASAR、ChatGPT.app、userData、未加工logは添付しないでください。
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: macOS / ChatGPT version and build
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: candidateが生成した秘密値除外済みbundleのみ使用してください。
